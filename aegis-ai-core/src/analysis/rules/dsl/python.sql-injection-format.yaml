id: dsl.python.sql-injection-format
language: python
severity: HIGH
message: "检测到使用字符串格式化构造 SQL 语句，存在注入风险。"
vuln_type: SQL_INJECTION
patterns:
  - pattern: $CURSOR.execute("SELECT" % $EXPR)
  - pattern: $CURSOR.execute("SELECT $SQL" % $EXPR)
  - pattern: $CURSOR.execute('SELECT' % $EXPR)
  - pattern: $CURSOR.execute('SELECT $SQL' % $EXPR)
  - pattern: $CURSOR.execute(f"SELECT {$EXPR}")
  - pattern: $CURSOR.execute(f"SELECT $SQL{$EXPR}")
  - pattern: $CURSOR.execute(f'SELECT {$EXPR}')
  - pattern: $CURSOR.execute(f'SELECT $SQL{$EXPR}')
tests:
  - name: detects Python percent-formatted SELECT
    code: |
      cursor.execute("SELECT * FROM users WHERE name = '%s'" % name)
    expect_findings: 1
  - name: skips Python parameterized query
    code: |
      cursor.execute("SELECT * FROM users WHERE id = ?", (user_id,))
    expect_findings: 0
