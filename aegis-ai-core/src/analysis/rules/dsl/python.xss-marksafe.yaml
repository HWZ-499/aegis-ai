id: dsl.python.xss-marksafe
language: python
severity: HIGH
message: "检测到 mark_safe 直接包装用户输入，存在 XSS 风险。"
vuln_type: XSS_RISK
patterns:
  - pattern: mark_safe($EXPR)
    where:
      file_not_regex: "(?i)test|fixture"
tests:
  - name: detects mark_safe wrapping request data
    code: |
      mark_safe(request.GET["name"])
    file_path: app/views.py
    expect_findings: 1
  - name: skips escaped request data
    code: |
      escape(request.GET["name"])
    file_path: app/views.py
    expect_findings: 0

