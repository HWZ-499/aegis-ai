# Publish aegis-ai-core to PyPI on version tag (Trusted Publishing)
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Release consistency check
        run: python aegis-ai-core/scripts/check_release_consistency.py

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: |
          cd aegis-ai-core
          python -m build

      - name: Check distribution
        run: |
          cd aegis-ai-core
          python scripts/check_distribution.py dist/*
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          directory: aegis-ai-core/dist
