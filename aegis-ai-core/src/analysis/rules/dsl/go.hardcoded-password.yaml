id: dsl.go.hardcoded-password
language: go
severity: HIGH
message: "检测到 Go 代码中疑似硬编码凭证变量，请改为从环境变量或安全配置加载。"
vuln_type: HARDCODED_CREDENTIALS
patterns:
  - pattern: $VAR := "$SECRET"
    metavariables:
      VAR:
        regex: "(?i)(password|passwd|pwd|secret|token|api_?key)"
      SECRET:
        not_regex: "^(changeme|example|sample|test|null|none)$"
  - pattern: $VAR = "$SECRET"
    metavariables:
      VAR:
        regex: "(?i)(password|passwd|pwd|secret|token|api_?key)"
      SECRET:
        not_regex: "^(changeme|example|sample|test|null|none)$"
tests:
  - name: detects hardcoded Go password
    code: |
      password := "S3cr3tValue!"
    expect_findings: 1
  - name: skips placeholder Go password
    code: |
      password := "example"
    expect_findings: 0

