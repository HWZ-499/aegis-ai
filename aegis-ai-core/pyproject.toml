[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai-core"
version = "1.5.0"
description = "Local-first SAST engine with AST analysis, taint tracking, and AI-powered fix suggestions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Aegis AI Team" }]
keywords = ["security", "sast", "static-analysis", "vulnerability", "ast"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tree-sitter==0.21.3",
    "tree-sitter-languages>=1.0.0",
    "pygls>=2.0.0",
    "lsprotocol>=2025.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
]
rag = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.0.0",
]
logging = [
    "python-json-logger>=2.0.0",
]
retry = [
    "tenacity>=8.2.0",
]
agent = [
    "langgraph>=1.0,<2",
]
all = [
    "aegis-ai-core[ai,rag,logging,retry,agent]",
]
dev = [
    "aegis-ai-core[agent]",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "psutil>=5.9.0",
    "ruff==0.15.21",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/HWZ-499/aegis-ai"
Repository = "https://github.com/HWZ-499/aegis-ai"
Issues = "https://github.com/HWZ-499/aegis-ai/issues"
Documentation = "https://github.com/HWZ-499/aegis-ai/tree/main/docs"
Changelog = "https://github.com/HWZ-499/aegis-ai/blob/main/aegis-ai-core/CHANGELOG.md"

[project.scripts]
aegis = "src.scanner.cli:main"
aegis-agent = "src.agent.cli:main"
aegis-lsp = "src.lsp.__main__:main"
aegis-scan = "src.scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.agent.knowledge_base" = ["*.md"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --strict-markers -m \"not benchmark and not acceptance and not integration\""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
    "benchmark: marks benchmark tests",
    "acceptance: marks acceptance suites and large benchmark-style regressions",
]
filterwarnings = [
    "ignore:.*Language\\(path, name\\) is deprecated.*:FutureWarning:tree_sitter",
]

# ---------------------------------------------------------------------------
# ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "**/tests/rules/**",
    "**/tests/debug_*.py",
    "**/tests/test_vulnerable_code.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "LOG",  # flake8-logging
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "E402",   # import not at top (conditional imports for optional deps)
    "E722",   # bare except (legacy, gradual migration)
    "E741",   # ambiguous variable name (e.g. `l` in comprehensions)
    "S101",   # assert used (ok in tests)
    "S110",   # try-except-pass (legacy, gradual migration to logger)
    "S112",   # try-except-continue
    "S324",   # md5 (used for non-crypto hashing in taint_graph)
    "S603",   # subprocess without shell=True (intentional in security tools)
    "S608",   # possible SQL injection (we analyze SQL, not inject it)
    "B007",   # loop variable not used
    "B023",   # function doesn't bind loop variable (closure in loops)
    "B027",   # empty method in abstract base class
    "B905",   # zip() without strict= (py310+)
    "N806",   # variable in function should be lowercase (module-level constants)
    "T201",   # print found (legacy code, will migrate to logger)
    "W291",   # trailing whitespace
    "W293",   # blank line contains whitespace
    "S607",   # partial executable path (git, intentional)
    "S104",   # bind to 0.0.0.0 (dev server, intentional)
    "LOG014", # exc_info outside handler (intentional for request logging)
    "B008",   # function call in default arg (FastAPI File(...))
    "B904",   # raise from err (legacy exception handling)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106", "T201"]
"**/scripts/**" = ["T201"]
"**/src/analysis/rules/**" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.core.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "src.lsp.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "src.analysis.rule_engine"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "src.analysis.base.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "src.scanner.project_scanner"
disallow_untyped_defs = true

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = []

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
]
show_missing = true
