# GitHub Actions: Security Scan + Code Quality
name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  # ── Code Quality Gate ────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Release consistency check
        run: python aegis-ai-core/scripts/check_release_consistency.py

      - name: Install dev dependencies
        run: |
          cd aegis-ai-core
          pip install -e ".[dev]" 2>/dev/null || pip install ruff mypy

      - name: Ruff lint
        run: |
          cd aegis-ai-core
          ruff check src/ tests/ --config pyproject.toml

      - name: Ruff format check
        run: |
          cd aegis-ai-core
          ruff format --check src/ tests/ --config pyproject.toml

      - name: mypy type check (release gate)
        run: |
          cd aegis-ai-core
          pip install types-PyYAML -q
          python scripts/typecheck_gate.py --group ci

      - name: mypy legacy debt report
        continue-on-error: true
        run: |
          cd aegis-ai-core
          pip install types-PyYAML -q
          python scripts/typecheck_gate.py --group legacy-report --report-file reports/mypy-legacy-report.txt

      - name: Upload mypy legacy debt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-legacy-report
          path: aegis-ai-core/reports/mypy-legacy-report.txt
          retention-days: 30

  # ── VSCode Extension Build Check ─────────────────────────────
  extension:
    name: Extension Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & type check
        run: |
          cd aegis-vscode
          npm ci
          npm run check

  extension-smoke:
    name: Extension Smoke Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & test extension
        run: |
          cd aegis-vscode
          npm ci
          npm test

  # ── Test Suite + Security Scan ───────────────────────────────
  security-scan:
    name: Tests & Security Scan
    runs-on: ubuntu-latest
    needs: [quality, extension, extension-smoke]
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd aegis-ai-core
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          cd aegis-ai-core
          python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing \
            --ignore=tests/test_vulnerable_code.py \
            --ignore=tests/test_api_direct.py \
            --ignore=tests/test_nvd_api.py \
            --ignore=tests/test_rag_optimizer.py

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: aegis-ai-core/coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: Benchmark acceptance
        run: |
          cd aegis-ai-core
          python -m pytest -m acceptance tests/test_acceptance_benchmark.py -v

      - name: Python integration tests
        run: |
          cd aegis-ai-core
          python -m pytest -m integration tests/ -v

      - name: DSL vs AST comparison
        run: |
          cd aegis-ai-core
          python -m pytest tests/test_dsl_vs_ast.py -v

      - name: Performance benchmark (pytest-benchmark)
        run: |
          cd aegis-ai-core
          python -m pytest -m benchmark tests/test_performance_benchmark.py -v --benchmark-only

      - name: Generate benchmark report
        run: |
          cd aegis-ai-core
          python scripts/benchmark/run_benchmark_report.py
        continue-on-error: true

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: benchmark-report
          path: aegis-ai-core/reports/benchmark_report_*.json
          retention-days: 90

      - name: Run Aegis security scan
        id: scan
        run: |
          cd aegis-ai-core
          python -m src.scanner.cli . --format sarif --output results.sarif --verbose --no-fail-on-findings

      - name: Run Aegis incremental scan (PR diff-only example)
        if: github.event_name == 'pull_request'
        run: |
          cd aegis-ai-core
          python -m src.scanner.cli . --incremental --base-ref origin/main --format json --no-fail-on-findings 2>/dev/null || true
        continue-on-error: true

      - name: Ensure SARIF exists
        if: always()
        run: |
          if [ ! -f aegis-ai-core/results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"Aegis","version":"1.0"}},"results":[]}]}' > aegis-ai-core/results.sarif
          fi

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: aegis-ai-core/results.sarif

      - name: Generate HTML report
        if: always()
        run: |
          cd aegis-ai-core
          python -m src.scanner.cli . --format html --output scan-report.html --no-fail-on-findings

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: aegis-ai-core/scan-report.html
          retention-days: 30

      - name: Comment PR with scan results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = path.join('aegis-ai-core', 'results.sarif');
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const results = report.runs[0]?.results || [];
              const critical = results.filter(r => r.level === 'error').length;
              const warning = results.filter(r => r.level === 'warning').length;
              const comment = `## Security Scan Results\n\n- Critical: ${critical}\n- Warning: ${warning}\n- Total: ${results.length}\n\n[View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
