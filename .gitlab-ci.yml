# GitLab CI 配置：安全扫描
stages:
  - test
  - security

variables:
  PYTHON_VERSION: "3.11"

security_scan:
  stage: security
  image: python:${PYTHON_VERSION}
  
  before_script:
    - cd aegis-ai-core
    - pip install -r requirements.txt
  
  script:
    # 增量扫描：只扫描本次提交修改的文件
    - |
      if [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then
        echo "🔍 执行增量扫描（对比 $CI_MERGE_REQUEST_TARGET_BRANCH_NAME）"
        python -m src.scanner.cli . --incremental --base-ref $CI_MERGE_REQUEST_TARGET_BRANCH_NAME --format json --output results.json --verbose
      else
        echo "🔍 执行全量扫描"
        python -m src.scanner.cli . --format json --output results.json --verbose
      fi
    
    # 生成 HTML 报告
    - python -m src.scanner.cli . --format html --output scan-report.html
    
    # 生成 SARIF 报告（如果支持）
    - python -m src.scanner.cli . --format sarif --output results.sarif || true
  
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - aegis-ai-core/results.json
      - aegis-ai-core/scan-report.html
      - aegis-ai-core/results.sarif
    reports:
      codequality: aegis-ai-core/results.json
  
  allow_failure: true  # 即使发现问题也不阻止 pipeline

security_scan_scheduled:
  stage: security
  image: python:${PYTHON_VERSION}
  only:
    - schedules  # 只在定时任务时运行
  
  before_script:
    - cd aegis-ai-core
    - pip install -r requirements.txt
  
  script:
    - echo "🔍 执行定时全量扫描"
    - python -m src.scanner.cli . --format json --output results.json --verbose
    - python -m src.scanner.cli . --format html --output scan-report.html
  
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - aegis-ai-core/results.json
      - aegis-ai-core/scan-report.html
