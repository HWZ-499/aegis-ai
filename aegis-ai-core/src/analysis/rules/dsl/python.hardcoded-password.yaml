id: dsl.python.hardcoded-password
language: python
severity: HIGH
message: "检测到疑似硬编码密码，请改为从安全配置或环境变量加载。"
vuln_type: HARDCODED_CREDENTIALS
patterns:
  - pattern: $VAR = "$SECRET"
    metavariables:
      VAR:
        regex: "(?i)(password|passwd|pwd|secret|token|api_?key)"
      SECRET:
        not_regex: "^(changeme|example|sample|test|null|none)$"

