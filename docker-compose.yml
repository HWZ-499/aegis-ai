version: "3.9"

services:
  # FastAPI HTTP 服务（RAG 聊天 + 代码审计）
  aegis-server:
    build:
      context: .
      target: server
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com/chat/completions}
      - AEGIS_DB_PATH=/data/aegis_db
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    volumes:
      - aegis-db:/data/aegis_db
      - ./aegis-ai-core/src:/app/aegis-ai-core/src:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/'); assert r.status_code == 200"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CLI 扫描器（一次性任务，挂载待扫描项目）
  aegis-scan:
    build:
      context: .
      target: cli
    volumes:
      - ${SCAN_TARGET:-./aegis-ai-core}:/target:ro
    command: ["/target", "--format", "json"]
    profiles:
      - scan

volumes:
  aegis-db:
