# GitHub Actions: Security Scan + Code Quality
name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  # ── Code Quality Gate ────────────────────────────────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Release consistency check
        run: python aegis-ai-core/scripts/check_release_consistency.py

      - name: Install dev dependencies
        run: |
          cd aegis-ai-core
          pip install -e ".[dev]" 2>/dev/null || pip install ruff mypy

      - name: Ruff lint
        run: |
          cd aegis-ai-core
          ruff check src/ tests/ --config pyproject.toml

      - name: Ruff format check
        run: |
          cd aegis-ai-core
          ruff format --check src/ tests/ --config pyproject.toml

      - name: mypy type check (release gate)
        run: |
          cd aegis-ai-core
          pip install types-PyYAML -q
          python scripts/typecheck_gate.py --group ci

  # ── VSCode Extension Build Check ─────────────────────────────
  extension:
    name: Extension Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install & type check
        run: |
          cd aegis-vscode
          npm ci
          npm run check

  extension-smoke:
    name: Extension Smoke Test
    # Pin while GitHub's floating Windows image transitions to Windows 2025 / VS 2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install & test extension
        run: |
          cd aegis-vscode
          npm ci
          npm test

  # ── Test Suite + Security Scan ───────────────────────────────
  security-scan:
    name: Tests & Security Scan
    runs-on: ubuntu-latest
    needs: [quality, extension, extension-smoke]
    permissions:
      security-events: write
      actions: read
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd aegis-ai-core
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          cd aegis-ai-core
          python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing \
            --ignore=tests/test_vulnerable_code.py \
            --ignore=tests/test_api_direct.py \
            --ignore=tests/test_nvd_api.py \
            --ignore=tests/test_rag_optimizer.py

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: aegis-ai-core/coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: Benchmark acceptance
        run: |
          cd aegis-ai-core
          python -m pytest -m acceptance tests/test_acceptance_benchmark.py -v

      - name: Python integration tests
        run: |
          cd aegis-ai-core
          python -m pytest -m integration tests/ -v

      - name: DSL vs AST comparison
        run: |
          cd aegis-ai-core
          python -m pytest tests/test_dsl_vs_ast.py -v

      - name: Performance benchmark (pytest-benchmark)
        run: |
          cd aegis-ai-core
          mkdir -p reports
          python -m pytest -m benchmark tests/test_performance_benchmark.py -v --benchmark-only \
            --benchmark-json=reports/performance-benchmark.json

      - name: Upload performance benchmark
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-benchmark
          path: aegis-ai-core/reports/performance-benchmark.json
          retention-days: 90

      - name: Generate benchmark report
        run: |
          cd aegis-ai-core
          python scripts/benchmark/run_benchmark_report.py
        continue-on-error: true

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: benchmark-report
          path: |
            aegis-ai-core/reports/benchmark_report_*.json
            aegis-ai-core/reports/quality_matrix_*.json
          retention-days: 90

      - name: Run Aegis security scan
        id: scan
        run: |
          cd aegis-ai-core
          python -m src.scanner.cli . --format sarif --output results.sarif --verbose --no-fail-on-findings

      - name: Run Aegis incremental scan (PR diff-only example)
        if: github.event_name == 'pull_request'
        run: |
          cd aegis-ai-core
          python -m src.scanner.cli . --incremental --base-ref origin/${{ github.base_ref }} --format json --output incremental-results.json --no-fail-on-findings 2>/dev/null || true
        continue-on-error: true

      - name: Validate SARIF output
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("aegis-ai-core/results.sarif")
          if not path.is_file():
              raise SystemExit("Aegis scan did not produce results.sarif")

          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("version") != "2.1.0":
              raise SystemExit("Unexpected SARIF version")
          runs = data.get("runs")
          if not isinstance(runs, list) or len(runs) != 1:
              raise SystemExit("SARIF must contain exactly one run")
          run = runs[0]
          driver = run.get("tool", {}).get("driver", {})
          if driver.get("name") != "Aegis AI":
              raise SystemExit("SARIF tool driver is missing or invalid")
          if not isinstance(run.get("results"), list):
              raise SystemExit("SARIF results must be a list")
          invocations = run.get("invocations")
          if not isinstance(invocations, list) or not invocations:
              raise SystemExit("SARIF invocation status is missing")
          PY

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('aegis-ai-core/results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: aegis-ai-core/results.sarif

      - name: Generate HTML report
        if: always()
        run: |
          cd aegis-ai-core
          python -m src.scanner.cli . --format html --output scan-report.html --no-fail-on-findings

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: aegis-ai-core/scan-report.html
          retention-days: 30

      - name: Comment PR with scan results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = path.join('aegis-ai-core', 'results.sarif');
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const results = report.runs[0]?.results || [];
              const critical = results.filter(r => r.level === 'error').length;
              const warning = results.filter(r => r.level === 'warning').length;
              const incrementalPath = path.join('aegis-ai-core', 'incremental-results.json');
              const lines = [
                '## Security Scan Results',
                '',
                '- Critical: ' + critical,
                '- Warning: ' + warning,
                '- Total: ' + results.length,
              ];

              if (fs.existsSync(incrementalPath)) {
                const incremental = JSON.parse(fs.readFileSync(incrementalPath, 'utf8'));
                const summary = incremental.summary || {};
                const severityStats = incremental.severity_stats || {};
                const newTotal = summary.total_issues ?? Object.values(incremental.results || {}).reduce((sum, findings) => sum + findings.length, 0);
                lines.push(
                  '',
                  '### New Issues in This PR',
                  '',
                  '- New total: ' + newTotal,
                  '- Critical: ' + (severityStats.critical || severityStats.Critical || 0),
                  '- High: ' + (severityStats.high || severityStats.High || 0),
                  '- Medium: ' + (severityStats.medium || severityStats.Medium || 0),
                  '- Low: ' + (severityStats.low || severityStats.Low || 0)
                );
              }

              lines.push('', `[View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`);
              const comment = lines.join('\n');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
