id: dsl.javascript.xss-response-send
language: javascript
severity: MEDIUM
message: "检测到将用户输入直接传给 res.send/res.write，存在 XSS 风险。"
vuln_type: XSS_RISK
patterns:
  - pattern: res.send($EXPR)
    metavariables:
      EXPR:
        regex: '(?i)\b(?:req|request)\.(?:query|body|params|cookies|headers)\b|\b(?:location\.(?:search|hash)|document\.cookie|window\.name)\b'
  - pattern: res.write($EXPR)
    metavariables:
      EXPR:
        regex: '(?i)\b(?:req|request)\.(?:query|body|params|cookies|headers)\b|\b(?:location\.(?:search|hash)|document\.cookie|window\.name)\b'
tests:
  - name: detects request data in res.send
    code: |
      res.send(req.query.name)
    expect_findings: 1
  - name: skips local variable in res.send
    code: |
      res.send(profileName)
    expect_findings: 0
